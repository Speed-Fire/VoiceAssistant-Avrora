name: Build
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: "web-api", path: "Server/VoiceAssistant.Server/"}
          - { name: "worker-s2t", path: "Server/VoiceAssistant.Server.SpeechToText/"}
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to gtihub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo name
        run: echo "REPO_NAME_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV


      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.path }}
          file: ${{ matrix.service.path }}/Dockerfile
          push: true
          tags: "ghcr.io/${{ github.repository_owner }}/$REPO_NAME_LOWER/${{ matrix.service.name }}:latest,ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}:sha-${{ github.sha }}"